      blip("sine", 2093, 2093, 0.16, 0.08, 0.07);
    }
    function playGood() {                                              // "따라랑" 상
      playJingle([["C5", 1], ["E5", 1], ["G5", 1], ["C6", 3]], 0.06);
    }
    function playBad() {                                               // "뿌우웅" 벌
      blip("sawtooth", 320, 70, 0.45, 0.07);
      blip("square", 160, 60, 0.45, 0.04);
    }
    function playMiss() {                                              // "뚜루루" 공을 놓쳤을 때
      playJingle([["G4", 1], ["E4", 1], ["C4", 1], ["G3", 3]], 0.08);
    }
    function playGameOver(delay = 0) {
      return playJingle([["E4", 2], ["D#4", 2], ["D4", 2], ["C#4", 2], ["C4", 6]], 0.12, "triangle", 0.25, delay);
    }
    function playClear() {
      return playJingle([["G4", 1], ["C5", 1], ["E5", 1], ["G5", 2], ["E5", 1], ["G5", 4]], 0.11);
    }
    function playTick() { blip("square", 1200, 1200, 0.03, 0.03); }  // "띡" 점수 올라가는 소리
    function playDing() {                                             // "딩!" 점수 다 올라갔을 때
      blip("sine", 1760, 1760, 0.6, 0.12);
      blip("sine", 2637, 2637, 0.4, 0.05);
    }

    // ---------------------------------------------------------
    // 이펙트 : 도트 조각(particles), 떠오르는 글씨(texts), 화면 번쩍(flash, flashColor), 점수판 하트 커지기(hudPop), 화면 흔들림(shake)
    // rings = 폭발할 때 퍼지는 충격파
    // beams = 예수님이 공을 꺼낼 때 바닥에서 솟는 빛기둥
    const fx = { particles: [], texts: [], rings: [], beams: [], flash: 0, flashColor: "255, 46, 136", hudPop: 0, shake: 0, muzzle: 0 };

    // gravity : 아래로 끌어당기는 힘 (음수면 위로 떠올라요)
    function burst(x, y, count, colors, minSpeed, maxSpeed, gravity) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = minSpeed + Math.random() * (maxSpeed - minSpeed);
        const life = 0.5 + Math.random() * 0.5;
        fx.particles.push({
          x, y, gravity, life, max: life,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color: colors[i % colors.length],
          size: Math.random() < 0.5 ? 4 : 3,
        });
      }
    }

    function floatText(text, x, y, color) {
      fx.texts.push({ text, x, y, color, life: 1 });
    }

    function updateEffects(dt) {
      fx.particles.forEach((p) => {
        p.vy += p.gravity * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
      });
      fx.particles = fx.particles.filter((p) => p.life > 0);
      fx.texts.forEach((t) => { t.y -= 40 * dt; t.life -= dt; });
      fx.texts = fx.texts.filter((t) => t.life > 0);
      fx.rings.forEach((r) => { r.life -= dt; });
      fx.rings = fx.rings.filter((r) => r.life > 0);
      fx.beams.forEach((b) => { b.life -= dt; });
      fx.beams = fx.beams.filter((b) => b.life > 0);
      if (figure.type) figure.t += dt;
      fx.flash = Math.max(0, fx.flash - dt);
      fx.hudPop = Math.max(0, fx.hudPop - dt);
      fx.shake = Math.max(0, fx.shake - dt);
      fx.muzzle = Math.max(0, fx.muzzle - dt);
    }

    function drawEffects() {
      // 빛기둥 : 바닥에서 위로 금빛 기둥이 솟았다가 옅어져요
      fx.beams.forEach((b) => {
        const k = b.life / b.max;
        ctx.globalAlpha = k * 0.6;
        ctx.fillStyle = "#fff3c4";
        ctx.fillRect(b.x - 14, 51, 28, H - 51);
        ctx.globalAlpha = k;
        ctx.fillStyle = "#fff";
        ctx.fillRect(b.x - 4, 51, 8, H - 51);
      });
      ctx.globalAlpha = 1;
      drawFigure();
      // 충격파 : 주황 고리가 커지면서 옅어져요
      fx.rings.forEach((r) => {
        const k = 1 - r.life / r.max;
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = k < 0.3 ? "#fff3b0" : "#ff7a1a";
        ctx.lineWidth = 6 * (1 - k) + 2;
        ctx.beginPath();
        ctx.arc(r.x, r.y, 10 + k * 70, 0, Math.PI * 2);
        ctx.stroke();
      });
      ctx.globalAlpha = 1;
      fx.particles.forEach((p) => {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.fillStyle = p.color;
        ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
      });
      ctx.font = '12px "Press Start 2P", monospace';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      fx.texts.forEach((t) => {
        ctx.globalAlpha = Math.max(0, t.life);
        ctx.fillStyle = "#000";
        ctx.fillText(t.text, t.x + 2, t.y + 2);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
      });
      ctx.globalAlpha = 1;
      if (fx.flash > 0) {
        ctx.fillStyle = `rgba(${fx.flashColor}, ${fx.flash * 2})`;
        ctx.fillRect(0, 0, W, H);
      }
    }

    // 점수판 하트 : 하나씩 그려서, 방금 얻은 하트(맨 오른쪽)만 커졌다 작아지며 깜빡여요
    function drawLives() {
      ctx.font = '16px "Press Start 2P", monospace';
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      const hw = ctx.measureText("❤️").width + 2;
      for (let i = 0; i < lives; i++) {
        const x = W - 16 - (lives - 1 - i) * hw;
        const isNew = fx.hudPop > 0 && i === lives - 1;
        if (isNew && Math.floor(fx.hudPop * 10) % 2 === 1) continue; // 깜빡
        const scale = isNew ? 1 + fx.hudPop * 0.8 : 1;
        ctx.save();
        ctx.translate(x - hw / 2, 28);
        ctx.scale(scale, scale);
        ctx.fillText("❤️", hw / 2, 0);
        ctx.restore();
      }
    }

    // 공이 벽돌에 맞았는지 보고, 맞았으면 깨고 튕겨요
    //   보통 공은 한 번에 벽돌 하나를 깨고 튕겨요
    //   불덩어리는 튕기지 않고 벽돌을 뚫고 지나가요. 맞은 벽돌은 폭발해서 둘레 벽돌까지 같이 터져요
    function hitBricks() {
      const hits = bricks.filter((b) => b.alive &&
        ball.x < b.x + BRICK_W && ball.x + ball.size > b.x &&
        ball.y < b.y + BRICK_H && ball.y + ball.size > b.y);
      if (!hits.length) return;

      if (timers.big > 0) {
        hits.forEach(explode);
        return; // 튕기지 않아요
      }

      const b = hits[0];
      b.alive = false;
      score += b.points;
      playBrick(b.row);
      checkSpecial(b);
      bounceOff(b);
    }

    // 폭발 : 맞은 벽돌 + 둘레 BLAST_RANGE 칸의 벽돌이 한꺼번에 터져요
    function explode(center) {
      if (!center.alive) return;
      const blasted = bricks.filter((b) => b.alive &&
        Math.abs(b.row - center.row) <= BLAST_RANGE && Math.abs(b.col - center.col) <= BLAST_RANGE);
      let gained = 0;
      blasted.forEach((b) => {
        b.alive = false;
        score += b.points;
        gained += b.points;
        burst(b.x + BRICK_W / 2, b.y + BRICK_H / 2, 8, [b.color, ...FIRE_COLORS], 80, 240, -60);
        checkSpecial(b);
      });
      const cx = center.x + BRICK_W / 2, cy = center.y + BRICK_H / 2;
      burst(cx, cy, 24, FIRE_COLORS, 120, 320, -150); // 불꽃이 위로 솟아요
      fx.rings.push({ x: cx, y: cy, life: 0.4, max: 0.4 }); // 퍼지는 충격파
      floatText("+" + gained, cx, cy, "#ffd23f");
      fx.shake = Math.max(fx.shake, 0.3);
      fx.flash = Math.max(fx.flash, 0.06);
      fx.flashColor = "255, 120, 30";
      playBoom();
    }

    // 불덩어리 꼬리 : 날아가는 동안 불씨가 뒤로 흩날리며 위로 올라가요
    function emitFire(dt) {
      const n = Math.ceil(dt * 120);
      for (let i = 0; i < n; i++) {
        const life = 0.25 + Math.random() * 0.3;
        fx.particles.push({
          x: ball.x + Math.random() * ball.size,
          y: ball.y + Math.random() * ball.size,
          vx: -ball.vx * 0.15 + (Math.random() - 0.5) * 60,
          vy: -ball.vy * 0.15 + (Math.random() - 0.5) * 60,
          gravity: -200, life, max: life,
          color: FIRE_COLORS[Math.floor(Math.random() * FIRE_COLORS.length)],
          size: Math.random() < 0.5 ? 6 : 4,
        });
      }
    }

    function bounceOff(b) {
      // 겹친 정도가 작은 쪽으로 부딪힌 것 : 위·아래면 세로로, 옆이면 가로로 튕겨요
      const fromLeft = ball.x + ball.size - b.x;
      const fromRight = b.x + BRICK_W - ball.x;
      const fromTop = ball.y + ball.size - b.y;
      const fromBottom = b.y + BRICK_H - ball.y;
      const sideHit = Math.min(fromLeft, fromRight) < Math.min(fromTop, fromBottom);
      if (sideHit) ball.vx = -ball.vx;
      else ball.vy = -ball.vy;
    }

    // 공 (네모난 도트 공)
    //   빠른 공 = 하늘색 + 뒤에 잔상, 불덩어리 = 빨강·주황·노랑·하양이 겹겹이 일렁여요. 끝나기 2초 전부터 깜빡여요
    const trail = []; // 빠른 공의 지난 위치들
    function drawBall() {
      if (bomb.time > 0) { drawBomb(); return; } // 폭탄이 되었을 때는 폭탄 모양이 먼저
      const fast = timers.speed > 0 && !timerBlink("speed");
      const big = timers.big > 0 && !timerBlink("big");
      const base = ctx.globalAlpha; // 투명한 공일 때는 잔상도 같이 흐려요
      if (fast && ball.launched) {
        trail.push({ x: ball.x, y: ball.y, size: ball.size });
        if (trail.length > 6) trail.shift();
        trail.forEach((t, i) => {
          ctx.globalAlpha = base * (i + 1) / (trail.length + 1) * 0.5;
          ctx.fillStyle = "#3fd8ff";
          ctx.fillRect(t.x, t.y, t.size, t.size);
        });
        ctx.globalAlpha = base;
      } else {
        trail.length = 0;
      }
      if (big || (timers.big > 0 && ball.size > BALL_SIZE + 2)) {
        drawFireBall(big);
        return;
      }
      ctx.fillStyle = fast ? "#bff3ff" : "#fff";
      ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
    }

    // 불덩어리 : 바깥부터 빨강 → 주황 → 노랑 → 하얀 심지. 겹마다 조금씩 흔들려서 불이 일렁여 보여요
    function drawFireBall(bright) {
      const s = ball.size;
      const layers = bright
        ? [["#ff3d1a", 1], ["#ff7a1a", 0.78], ["#ffd23f", 0.55], ["#fff3b0", 0.3]]
        : [["#8a2a10", 1], ["#ff5a1a", 0.6]]; // 꺼져갈 때는 어둡게
      layers.forEach(([color, k], i) => {
        const size = Math.round(s * k);
        const jitter = i === 0 ? 0 : Math.round((Math.random() - 0.5) * 4);
        ctx.fillStyle = color;
        ctx.fillRect(Math.round(ball.x + (s - size) / 2 + jitter), Math.round(ball.y + (s - size) / 2 - jitter), size, size);
      });
      // 바깥 불꽃 : 모서리마다 작은 불길이 날름거려요
      if (!bright) return;
      ctx.fillStyle = "#ff7a1a";
      for (let i = 0; i < 6; i++) {
        const side = Math.floor(Math.random() * 4);
        const along = Math.random() * s;
        const f = 4 + Math.random() * 6;
        if (side === 0) ctx.fillRect(ball.x + along, ball.y - f, 4, f);
        else if (side === 1) ctx.fillRect(ball.x + along, ball.y + s, 4, f);
        else if (side === 2) ctx.fillRect(ball.x - f, ball.y + along, f, 4);
        else ctx.fillRect(ball.x + s, ball.y + along, f, 4);
      }
    }

    // 벽돌 하나 그리기 : 위·왼쪽은 밝게, 아래·오른쪽은 어둡게 해서 도톰해 보이게
    function drawBrick(b) {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, BRICK_W, BRICK_H);
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.fillRect(b.x, b.y, BRICK_W, 3);
      ctx.fillRect(b.x, b.y, 3, BRICK_H);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(b.x, b.y + BRICK_H - 3, BRICK_W, 3);
      ctx.fillRect(b.x + BRICK_W - 3, b.y, 3, BRICK_H);
    }

    function draw() {
      // 배경
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);

      // 화면 흔들림 : 남은 시간만큼 이리저리 몇 픽셀씩 밀어서 그려요
      ctx.save();
      if (fx.shake > 0) {
        const power = fx.shake * 20;
        ctx.translate(Math.round((Math.random() - 0.5) * power), Math.round((Math.random() - 0.5) * power));
      }

      // 맨 위 점수판
      ctx.font = '16px "Press Start 2P", monospace';
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.textAlign = "left";
      ctx.fillText("SCORE " + String(score).padStart(4, "0"), 16, 28);
      drawLives();

      // 점수판 아래 줄
      ctx.fillStyle = "#ff2e88";
      ctx.fillRect(0, 48, W, 3);

      // 벽돌
      bricks.filter((b) => b.alive).forEach(drawBrick);
      drawSpecialBricks();
      drawTetris();
      drawCat(); // 할퀸 자국 (공·패들 뒤에 그려서 공이 가려지지 않아요)
      drawWalls();
      drawSaveLine();
      drawBombZone();

      // 패들 : 줄어든 동안은 보라색, 원래대로 돌아오기 2초 전부터 깜빡여요
      const shrunk = timers.shrink > 0 && !timerBlink("shrink");
      ctx.fillStyle = shrunk ? "#d9a6ff" : "#e0e0ff";
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.fillStyle = shrunk ? "#8a2be2" : "#7a7aff";
      ctx.fillRect(paddle.x, paddle.y + paddle.h - 4, paddle.w, 4);

      drawGun();
      if (!ball.escaping) {
        ctx.globalAlpha = ballVisibility(); // 투명한 공 : 패들 가까이 올수록 선명해져요
        if (ctx.globalAlpha > 0) drawBall();
        ctx.globalAlpha = 1;
      }

      // 아래 안내 글씨
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.textAlign = "center";
      ctx.fillStyle = "#ffb000";
      if (tetris.active) ctx.fillText("←→ MOVE  SPACE TURN  ↑ FAST", W / 2, H - 12);
      else if (!ball.launched && !gameOver) ctx.fillText("PRESS SPACE", W / 2, H - 12); // 끝 화면에서는 팝업이 안내해요
      else if (timers.gun > 0) ctx.fillText("SPACE: FIRE!", W / 2, H - 12);

      drawEffects();
      ctx.restore();
    }

    // 키보드 : 화살표를 누르고 있는 동안 true
    const keys = { left: false, right: false, up: false, fire: false };
    const PADDLE_SPEED = 420; // 1초에 움직이는 거리 (픽셀)
    const GAME_KEYS = ["ArrowLeft", "ArrowRight", "ArrowUp", " "];

    document.addEventListener("keydown", (e) => {
      ensureAudio(); // 소리 준비 (브라우저는 키를 누른 뒤에만 소리를 낼 수 있어요)
      // M 키 = 소리 켜기/끄기 (한글 자판일 때도 되게 글자 대신 키 자리로 봐요)
      if (e.code === "KeyM" && !e.repeat) { toggleSound(); return; }
      if (gameOver) {
        // 끝 화면에서는 스페이스·엔터가 "다시 하기" 버튼을 눌러요
        // 버튼 밖을 눌러서 버튼 선택이 풀렸어도 "PRESS SPACE" 안내대로 되게 해요
        if ((e.key === " " || e.key === "Enter") && document.activeElement !== retryBtn) {
          e.preventDefault();
          restart();
        }
        return;
      }
      if (GAME_KEYS.includes(e.key)) e.preventDefault();
      if (adTime > 0) return; // 광고 중에는 키가 안 먹어요
      if (tetris.active) {
        if (e.key === "ArrowUp") keys.up = true;
        tetrisKey(e.key); // 이벤트 중에는 조각을 움직여요 (누르고 있으면 계속 움직여요)
        return;
      }
      if (e.key === "ArrowLeft") keys.left = true;
      if (e.key === "ArrowRight") keys.right = true;
      if (e.key === " " && !ball.launched) launchBall();
      else if (e.key === " ") keys.fire = true; // 총을 가졌을 때 쏘기
    });
    document.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft") keys.left = false;
      if (e.key === "ArrowRight") keys.right = false;
      if (e.key === "ArrowUp") keys.up = false;
      if (e.key === " ") keys.fire = false;
    });
    // 다른 창으로 넘어가면 손을 뗀 것으로 쳐요 (패들이 혼자 계속 가지 않게)
    window.addEventListener("blur", () => { keys.left = keys.right = keys.up = keys.fire = false; });

    // dt = 지난 화면에서 지난 시간(초). 컴퓨터가 빠르든 느리든 같은 속도로 움직여요
    function update(dt) {
      if (gameOver) return;
      if (tetris.active) { updateTetris(dt); return; } // 테트리스 중에는 공·패들이 멈춰요
      updateBombWave(dt); // 폭탄 성공 폭발은 공이 어디 있든 끝까지 퍼져요
      if (gameOver) return;
      let dir = 0;
      if (keys.left) dir -= 1;
      if (keys.right) dir += 1;
      paddle.x += dir * PADDLE_SPEED * dt;
      updateTimers(dt, ball.launched); // 효과 시간은 공이 날아다니는 동안만 흘러요

      // 화면 밖으로 못 나가게
      paddle.x = Math.max(WALL, Math.min(W - WALL - paddle.w, paddle.x));
      updateGun(dt);

      // 구멍으로 나간 공이 떨어지는 중이에요
      if (ball.escaping) { updateEscape(dt); return; }

      if (!ball.launched) {
        // 발사 전에는 공이 패들 가운데 위에 붙어 다녀요
        ball.x = paddle.x + paddle.w / 2 - ball.size / 2;
        ball.y = paddle.y - ball.size - 4;
        return;
      }

      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      if (timers.big > 0 && Math.random() < ballVisibility()) emitFire(dt); // 투명할 땐 불씨도 안 보여요

      // 왼쪽·오른쪽 벽에 튕기기 (벽 구멍 높이면 튕기지 않고 지나가요)
      if (ball.x < WALL && !ballInHole(-1)) { ball.x = WALL; ball.vx = Math.abs(ball.vx); playWall(); }
      if (ball.x > W - WALL - ball.size && !ballInHole(1)) { ball.x = W - WALL - ball.size; ball.vx = -Math.abs(ball.vx); playWall(); }
      // 구멍을 지나 게임 화면 가장자리에 닿으면, 화면 밖으로 튀어나가 떨어져요
      if (ball.x < 0 || ball.x + ball.size > W) {
        startEscape();
        return;
      }
      // 위쪽(점수판 아래 줄)에 튕기기
      if (ball.y < 51) { ball.y = 51; ball.vy = Math.abs(ball.vy); playWall(); }

      hitBricks();
      if (tetris.active) return; // 방금 물음표 벽돌을 깼으면 다음 화면부터 테트리스
      updateBomb(dt); // 폭탄 카운트다운도 공이 날아다니는 동안만 흘러요
      updateSpecials(dt); // 공이 날아다니는 동안만 특수 벽돌 시간이 흘러요
      // 벽돌을 다 깼으면 클리어!
      if (bricks.every((b) => !b.alive)) {
        showEnd(true);
        return;
      }

      // 패들에 튕기기 : 패들 가운데에 맞으면 위로, 끝에 맞을수록 옆으로 비스듬히
      if (ball.vy > 0 &&
          ball.y + ball.size >= paddle.y && ball.y + ball.size <= paddle.y + paddle.h &&
          ball.x + ball.size >= paddle.x && ball.x <= paddle.x + paddle.w) {
        const hit = (ball.x + ball.size / 2 - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
        const angle = hit * (Math.PI / 3); // 최대 60도
        ball.vx = ballSpeed() * Math.sin(angle);
        ball.vy = -ballSpeed() * Math.cos(angle);
        ball.y = paddle.y - ball.size;
        playPaddle();
      }

      // 바닥으로 떨어지면 목숨 1개 줄이고, 공은 다시 패들 위로
      if (ball.y > H) {
        if (jesusSave) { rescueBall(); playGood(); } // 예수님이 한 번 꺼내 줘요
        else { playMiss(); loseLife(); }
      }
    }

    function loseLife() {
      if (!testGod) lives -= 1; // 테스트 모드의 무적이면 목숨이 안 줄어요
      ball.launched = false;
      cancelBomb(); // 폭탄을 들고 떨어지면 폭탄은 그냥 사라져요
      if (lives <= 0) showEnd(false);
    }

    // 광고 팝업 : 떠 있는 동안(adTime 초) 게임 전체가 멈춰요. 공·패들·고양이·테트리스·이펙트 모두
    const AD_TIME = 4;
    const adPopup = document.getElementById("ad-popup");
    const adCount = document.getElementById("ad-count");
    let adTime = 0;

    function showAd() {
      adTime = AD_TIME;
      keys.left = keys.right = keys.up = keys.fire = false;
      adCount.textContent = AD_TIME;
      adPopup.hidden = false;
    }

    function updateAd(dt) {
      adTime -= dt;
      adCount.textContent = Math.max(1, Math.ceil(adTime));
      if (adTime <= 0) {
        adTime = 0;
        adPopup.hidden = true;
      }
    }

    const gameoverBox = document.getElementById("gameover");
    const endTitle = document.getElementById("end-title");
    const retryBtn = document.getElementById("retry");

    // 끝 화면 : cleared = true 면 클리어, false 면 게임 오버 (같은 창을 글씨·색만 바꿔서 써요)
    //   음악이 멈추고 → 게임 오버·클리어 멜로디 → 점수가 0부터 "띡띡띡" 올라가다 "딩!"
    const finalScore = document.getElementById("final-score");
    const SCORE_COUNT_TIME = 1.2; // 점수가 올라가는 시간 (초)
    let scoreTimer = null;

    function showEnd(cleared) {
      gameOver = true;
      keys.left = keys.right = false;
      // 글씨는 영어로 : 레트로 글꼴(Press Start 2P)에 한글이 없어서, 영어여야 도트 글씨로 나와요
      endTitle.textContent = cleared ? "STAGE CLEAR!" : "GAME OVER";
      gameoverBox.classList.toggle("cleared", cleared);
      stopTetrisMusic();
      // 게임 오버는 공을 놓친 "뚜루루" 와 겹치지 않게 0.5초 쉬었다가 멜로디. jingle = 멜로디가 끝나는 시각(초)
      const jingle = cleared ? playClear() : playGameOver(0.5);
      finalScore.textContent = scoreText(0);
      finalScore.classList.remove("counting");
      gameoverBox.hidden = false;
      retryBtn.focus(); // 키보드로 바로 누를 수 있게
      countScore(score, jingle);
    }

    // 점수판처럼 4자리 (0340)
    const scoreText = (n) => String(n).padStart(4, "0");

    // 점수를 0부터 target 까지 올려요. wait 초 뒤에 시작. 올라가는 동안 숫자가 깜빡여요
    function countScore(target, wait) {
      clearTimeout(scoreTimer);
      const steps = target > 0 ? 24 : 0;
      let i = 0;
      const tick = () => {
        if (!gameOver) return;
        i += 1;
        finalScore.textContent = scoreText(Math.round(target * Math.min(1, i / steps)));
        finalScore.classList.toggle("counting", i < steps);
        if (i >= steps) { playDing(); return; }
        playTick();
        scoreTimer = setTimeout(tick, (SCORE_COUNT_TIME / steps) * 1000);
      };
      scoreTimer = setTimeout(steps ? tick : playDing, wait * 1000);
    }

    // 다시 하기 : 점수·목숨·벽돌·패들 위치를 처음으로
    function restart() {
      makeBricks();
      resetSpecials();
      tetris.active = false;
      tetris.piece = null;
      stopTetrisMusic();
      clearTimeout(scoreTimer);
      cat.active = false;
      clearCatLayers();
      for (const name of Object.keys(timers)) timers[name] = 0;
      paddle.w = PADDLE_W;
      ball.size = BALL_SIZE;
      fx.shake = 0;
      fx.particles = [];
      fx.texts = [];
      fx.rings = [];
      fx.beams = [];
      figure.type = null;
      jesusSave = false;
      cancelBomb();
      bomb.wave = [];
      bullets = [];
      score = 0;
      lives = 3;
      paddle.x = W / 2 - paddle.w / 2;
      ball.launched = false;
      ball.escaping = false;
      adTime = 0;
      adPopup.hidden = true;
      gameOver = false;
      gameoverBox.hidden = true;
      retryBtn.blur();
    }
    retryBtn.addEventListener("click", restart);

    // 살짝 비스듬히 위로 발사 (왼쪽·오른쪽은 무작위)
    function launchBall() {
      const angle = (Math.random() < 0.5 ? -1 : 1) * (Math.PI / 8);
      ball.vx = ballSpeed() * Math.sin(angle);
      ball.vy = -ballSpeed() * Math.cos(angle);
      ball.launched = true;
    }

    // ---------------------------------------------------------
    // 테스트 모드 : 오른쪽 위 TEST 버튼을 누르거나, 주소 끝에 ?test 를 붙여서 열면 (brick.html?test) 왼쪽 위에 버튼 판이 생겨요
    //   버튼을 누르면 그 상·벌·이벤트가 바로 일어나요 (한 번 받은 것도 몇 번이든 다시 돼요)
    //   벽돌 채우기 = 벽돌 32개를 처음처럼, 무적 = 공을 놓쳐도 목숨이 안 줄어요
    const TEST_BUTTONS = {
      good: [["heart", "❤️ 하트"], ["big", "🔥 불덩어리"], ["gun", "🔫 총"], ["buddha", "🌸 부처님"], ["jesus", "✝️ 예수님"], ["bomb", "💣 폭탄"]],
      bad: [["shrink", "💀 해골"], ["speed", "⚡ 번개"], ["hole", "🧱 벽 구멍"], ["ghost", "👁 투명"], ["ad", "📺 광고"], ["addrow", "⬇️ 한 줄"]],
      event: [["tetris", "❓ 테트리스"], ["cat", "🐱 고양이"]],
    };
    let testGod = false;

    const testPanel = document.getElementById("test-panel");
    const testBtn = document.getElementById("test-btn");
    const godBtn = document.getElementById("test-god");

    // 테스트 모드 켜기/끄기 : 판을 보이거나 숨기고, 주소의 ?test 도 맞춰요 (새로 고침해도 그대로)
    //   끌 때는 무적도 같이 꺼요 (판이 안 보이는데 무적만 남지 않게)
    function setTestMode(on) {
      testPanel.hidden = !on;
      testBtn.setAttribute("aria-pressed", String(on));
      if (!on && testGod) {
        testGod = false;
        godBtn.setAttribute("aria-pressed", "false");
      }
      const url = new URL(location.href);
      if (on) url.searchParams.set("test", "");
      else url.searchParams.delete("test");
      try { history.replaceState(null, "", url.href.replace("test=", "test")); } catch (e) {} // ?test= 대신 ?test
    }
    testBtn.addEventListener("click", (e) => {
      setTestMode(testPanel.hidden);
      e.currentTarget.blur(); // 스페이스가 버튼을 또 누르지 않게
    });

    function setupTestMode() {
      const panel = testPanel;
      Object.entries(TEST_BUTTONS).forEach(([group, list]) => {
        const box = panel.querySelector(`[data-group="${group}"]`);
        list.forEach(([type, label]) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = label;
          btn.addEventListener("click", () => testTrigger(type));
          box.appendChild(btn);
        });
      });
      document.getElementById("test-refill").addEventListener("click", (e) => {
        makeBricks();
        activeSpecials = [];
        e.currentTarget.blur();
      });
      document.getElementById("test-god").addEventListener("click", (e) => {
        testGod = !testGod;
        e.currentTarget.setAttribute("aria-pressed", String(testGod));
        e.currentTarget.blur();
      });
    }

    // 버튼으로 바로 실행 : 게임 중이 아니면 먼저 공을 발사하고, 이펙트는 바로 칠 수 있는 벽돌 자리에서 터져요
    function testTrigger(type) {
      document.activeElement.blur(); // 버튼에 남은 선택 때문에 스페이스가 버튼을 또 누르지 않게
      if (gameOver || tetris.active || adTime > 0) return;
      if (!ball.launched) launchBall();
      const b = exposedBricks()[0];
      const cx = b ? b.x + BRICK_W / 2 : W / 2;
      const cy = b ? b.y + BRICK_H / 2 : 150;
      floatText(SPECIAL_TYPES[type].label, cx, cy - 20, SPECIAL_TYPES[type].sparkle[0]);
      applySpecial(type, cx, cy);
    }
    setupTestMode();
    if (new URLSearchParams(location.search).has("test")) setTestMode(true); // 주소에 ?test 가 있으면 켜진 채로 시작

    let last = 0;
    function loop(now) {
      const dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
      last = now;
      if (adTime > 0) {
        updateAd(dt); // 광고가 떠 있으면 게임은 그대로 멈춰 있어요
      } else {
        update(dt);
        if (!gameOver) updateCat(dt); // 고양이는 공이 날아다니든 기다리든 상관없이 움직여요
        updateEffects(dt); // 게임이 끝나도 이펙트는 끝까지 흘러가요
      }
      draw();
      drawOverlay(); // 오락기 바깥 : 거대 고양이, 테두리 구멍, 구멍으로 떨어지는 공
      requestAnimationFrame(loop);
    }

    // 글꼴을 다 불러온 뒤에 시작해야 점수판 글씨가 레트로 글꼴로 나와요
    document.fonts.load('16px "Press Start 2P"').finally(() => requestAnimationFrame(loop));
  </script>
</body>
</html>
